format = 2

[effect]
id = "concat.jitter"
name = "Jitter"
version = 2
kind = "effect"
category = "Motion"
order = 301
intensity = "amount"
aliases = ["shake-fast"]
description = "A fast little jump of the frame, one step at a time - the edit's nervous energy."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2.5
step = 0.1

[wgsl]
entry = "effect.wgsl"