format = 2

[effect]
id = "concat.strobe"
name = "Strobe"
version = 2
kind = "effect"
category = "Motion"
order = 304
intensity = "amount"
aliases = ["flash", "blink"]
description = "White flashes over the picture, on a fixed beat."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"