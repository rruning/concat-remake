format = 2

[effect]
id = "concat.bounce"
name = "Bounce"
version = 2
kind = "effect"
category = "Motion"
order = 302
intensity = "amount"
aliases = ["pulse-zoom"]
description = "The picture pulsing in and out on a steady beat."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"