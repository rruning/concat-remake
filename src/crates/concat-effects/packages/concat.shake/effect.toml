format = 2

[effect]
id = "concat.shake"
name = "Shake"
version = 2
kind = "effect"
category = "Motion"
order = 300
intensity = "amount"
aliases = ["camera-shake", "temblor"]
description = "The frame shaken about its centre, like a camera in the hand."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"