format = 2

[effect]
id = "concat.heartbeat"
name = "Heartbeat"
version = 2
kind = "effect"
category = "Motion"
order = 303
intensity = "amount"
aliases = ["pulse-heart"]
description = "A double thump of zoom, like a heart - once, then once more, then quiet."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 1.5
step = 0.1

[wgsl]
entry = "effect.wgsl"