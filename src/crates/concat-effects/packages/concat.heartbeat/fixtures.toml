# A flat picture heartbeating is the same flat picture wherever it is
# sampled from, and the probes run at the timeline's start, where the
# beat is at its first thump: the picture through unchanged, at every
# bound.

[[probe]]
name = "default, a flat grey"
input = [0.5, 0.5, 0.5, 1]
expect = [0.5, 0.5, 0.5, 1]

[[probe]]
name = "minimum, a flat grey"
at = "min"
input = [0.5, 0.5, 0.5, 1]
expect = [0.5, 0.5, 0.5, 1]

[[probe]]
name = "maximum, a flat grey"
at = "max"
input = [0.5, 0.5, 0.5, 1]
expect = [0.5, 0.5, 0.5, 1]